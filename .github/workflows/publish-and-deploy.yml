name: Publish & Deploy

on:
  push:
    tags:
      - 'v*'

  workflow_dispatch:

permissions:
  contents: read
  packages: write
  pages: write
  id-token: write

jobs:
  publish-package:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Configure npm registry
        run: |
          npm config set "@0xdps:registry" "https://npm.pkg.github.com"
          npm config set "//npm.pkg.github.com/:_authToken" "${{ secrets.GITHUB_TOKEN }}"

      - name: Publish to GitHub Packages
        run: npm publish --registry https://npm.pkg.github.com

  deploy-pages:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Get version from tag
        id: tag_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Create versioned directory structure
        run: |
          mkdir -p dist/${{ steps.tag_version.outputs.VERSION }}
          mkdir -p dist/latest
          cp js/footer.js dist/${{ steps.tag_version.outputs.VERSION }}/footer.js
          cp js/footer.js dist/latest/footer.js
          cp README.md dist/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
